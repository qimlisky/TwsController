name: Version Check

on:
  pull_request:
    paths:
      - "wpf/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate AppMeta version format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version format
        shell: bash
        env:
          FILE: wpf/src/PodsController.Wpf/Core/AppMeta.cs
        run: |
          set -euo pipefail

          CODE=$(sed -n 's/.*public const string AppVersion = "\([^"]*\)".*/\1/p' "$FILE" | head -n 1)
          if [[ ! "$CODE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::AppMeta.AppVersion must be MAJOR.MINOR.PATCH, got: '$CODE'"
            exit 1
          fi

          echo "AppVersion $CODE is valid."
          {
            echo "### Version Check"
            echo ""
            echo "- AppVersion: \`$CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"
