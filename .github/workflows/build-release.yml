name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            rid: win-x64
          - arch: arm64
            platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $out = "dist/TwsController-${{ matrix.arch }}"
          dotnet publish "wpf/src/PodsController.Wpf/PodsController.Wpf.csproj" `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained false `
            -p:Platform=${{ matrix.platform }} `
            -o $out

          if (-not (Test-Path $out)) { throw "publish output not found: $out" }
          if (-not (Test-Path "$out/TwsController.exe")) { throw "TwsController.exe not found" }

          $zip = "dist/TwsController-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwsController-windows-${{ matrix.arch }}
          path: dist/TwsController-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TwsController-windows-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TwsController ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          body: |
            TwsController Windows build.

            Requirements: .NET 10 Desktop Runtime (x64 or ARM64).
            Download the zip matching your CPU architecture, extract it, and run `TwsController.exe`.
