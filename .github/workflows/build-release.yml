name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to build artifacts only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          FILE: wpf/src/PodsController.Wpf/Core/AppMeta.cs
        run: |
          set -euo pipefail

          CODE=$(sed -n 's/.*public const string AppVersion = "\([^"]*\)".*/\1/p' "$FILE" | head -n 1)
          if [[ ! "$CODE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::AppMeta.AppVersion must be MAJOR.MINOR.PATCH, got: '$CODE'"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="$GITHUB_REF_NAME"
            RELEASE=true
          else
            TAG="${{ inputs.tag }}"
            if [[ -z "$TAG" ]]; then
              TAG="v$CODE"
              RELEASE=false
            else
              RELEASE=true
            fi
          fi

          if [[ "$RELEASE" == "true" ]]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag must look like v1.2.3, got: '$TAG'"
              exit 1
            fi
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$CODE" ]]; then
              echo "::error::Tag '$TAG' does not match AppMeta.AppVersion '$CODE'"
              exit 1
            fi
          else
            VERSION="$CODE"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version=$VERSION tag=$TAG release=$RELEASE"

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            rid: win-x64
          - arch: arm64
            platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $out = "dist/TwsController-${{ matrix.arch }}"
          dotnet publish "wpf/src/PodsController.Wpf/PodsController.Wpf.csproj" `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained false `
            -p:Platform=${{ matrix.platform }} `
            -o $out

          if (-not (Test-Path $out)) { throw "publish output not found: $out" }
          if (-not (Test-Path "$out/TwsController.exe")) { throw "TwsController.exe not found" }

          $zip = "dist/TwsController-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwsController-windows-${{ matrix.arch }}
          path: dist/TwsController-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TwsController-windows-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.sha }}
          name: TwsController ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          body: |
            TwsController ${{ needs.validate.outputs.version }} Windows build.

            Requirements: .NET 10 Desktop Runtime (x64 or ARM64).
            Download the zip matching your CPU architecture, extract it, and run `TwsController.exe`.
