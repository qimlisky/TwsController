name: Build and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      confirm_major:
        description: "Confirm a MAJOR release (required when bump=major)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Validate and bump version
    if: ${{ github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          FILE: wpf/src/PodsController.Wpf/Core/AppMeta.cs
        run: |
          set -euo pipefail

          CODE=$(sed -n 's/.*public const string AppVersion = "\([^"]*\)".*/\1/p' "$FILE" | head -n 1)
          if [[ ! "$CODE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::AppMeta.AppVersion must be MAJOR.MINOR.PATCH, got: '$CODE'"
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must look like v1.2.3, got: '$TAG'"
              exit 1
            fi
            if [[ "$VERSION" != "$CODE" ]]; then
              echo "::error::Tag version '$VERSION' does not match AppMeta.AppVersion '$CODE'"
              exit 1
            fi
            SHA=$(git rev-parse HEAD)
          else
            BUMP="${{ inputs.bump }}"
            if [[ -z "$BUMP" ]]; then BUMP=patch; fi
            if [[ "$BUMP" == "major" && "${{ inputs.confirm_major }}" != "true" ]]; then
              echo "::error::MAJOR release requires confirm_major=true"
              exit 1
            fi
            if [[ "$BUMP" != "patch" && "$BUMP" != "minor" && "$BUMP" != "major" ]]; then
              echo "::error::Unknown bump type: '$BUMP'"
              exit 1
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "$CODE"
            case "$BUMP" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            TAG="v$VERSION"

            LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)
            if [[ -n "$LATEST_TAG" ]]; then
              LATEST_VERSION="${LATEST_TAG#v}"
              if [[ "$LATEST_VERSION" == "$VERSION" ]] || \
                 [[ "$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
                echo "::error::New version '$VERSION' must be greater than latest tag '$LATEST_TAG'"
                exit 1
              fi
            fi

            python3 - "$FILE" "$VERSION" <<'PY'
            import re
            import sys
            from pathlib import Path

            path, version = sys.argv[1], sys.argv[2]
            text = Path(path).read_text(encoding="utf-8")
            new_text, count = re.subn(
                r'(public const string AppVersion\s*=\s*")[^"]*(")',
                rf'\g<1>{version}\g<2>',
                text,
                count=1,
            )
            if count != 1:
                raise SystemExit("AppVersion declaration not found")
            Path(path).write_text(new_text, encoding="utf-8")
            PY

            CODE_AFTER=$(sed -n 's/.*public const string AppVersion = "\([^"]*\)".*/\1/p' "$FILE" | head -n 1)
            if [[ "$CODE_AFTER" != "$VERSION" ]]; then
              echo "::error::Failed to update AppMeta.AppVersion to '$VERSION'"
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "chore(release): v$VERSION [skip ci]"
            git push origin "HEAD:main"
            SHA=$(git rev-parse HEAD)
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG sha=$SHA"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            rid: win-x64
          - arch: arm64
            platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $out = "dist/TwsController-${{ matrix.arch }}"
          dotnet publish "wpf/src/PodsController.Wpf/PodsController.Wpf.csproj" `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained false `
            -p:Platform=${{ matrix.platform }} `
            -o $out

          if (-not (Test-Path $out)) { throw "publish output not found: $out" }
          if (-not (Test-Path "$out/TwsController.exe")) { throw "TwsController.exe not found" }

          $zip = "dist/TwsController-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwsController-windows-${{ matrix.arch }}
          path: dist/TwsController-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TwsController-windows-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: TwsController ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          body: |
            TwsController ${{ needs.prepare.outputs.version }} Windows build.

            Requirements: .NET 10 Desktop Runtime (x64 or ARM64).
            Download the zip matching your CPU architecture, extract it, and run `TwsController.exe`.
